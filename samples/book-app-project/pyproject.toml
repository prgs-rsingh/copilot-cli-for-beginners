[project]
name = "book-app"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = ["pytest>=9.0,<10"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade, RUF = ruff-specific
select = ["E", "F", "I", "UP", "RUF"]
ignore = [
    "RUF001",  # ambiguous Unicode in docstrings (intentional µ/× in bench output)
    "RUF002",  # ambiguous Unicode in docstrings
    "RUF003",  # ambiguous Unicode in comments
]

[tool.ruff.lint.per-file-ignores]
"bench_books.py" = ["E501"]  # long f-strings in benchmark report lines are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
