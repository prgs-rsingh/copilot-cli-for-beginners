[project]
name = "book-app"
version = "0.1.0"
requires-python = ">=3.10"
# Validated at: pytest==9.0.3, pytest-cov==7.1.0, coverage==7.13.5, ruff==0.15.12
# Rollback: .venv/bin/pip install "pytest==<previous>" "pytest-cov==<previous>"
dependencies = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[project.optional-dependencies]
# Install dev tools: pip install -e ".[dev]"
# Rollback: remove this section; .venv/bin/pip uninstall ruff
dev = [
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=term-missing --cov-report=html:htmlcov"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*", ".venv/*", "__pycache__/*"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:"]

# ── Ruff configuration ────────────────────────────────────────────────────────
# books.py is the *strictest* path: rules E, F, UP, ANN, I are enforced there
# via CI (walk-evidence.yml job: strict-lint).
# Other files are not in scope for this strict gate.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Rules applied project-wide.
# Expanded in Run-14 from ["E","F","I","UP"] → ["E","F","I","UP","PERF","SIM","PT"]
# PERF: performance anti-patterns (dict comprehensions, try-in-loop overhead)
# SIM:  simplifiable constructs (nested-with, redundant conditions)
# PT:   pytest-specific rules (fixture style, broad raises)
select = ["E", "F", "I", "UP", "PERF", "SIM", "PT"]
ignore = [
    "D203",  # conflicts with D211 (no-blank-line-before-class)
    "D213",  # conflicts with D212 (multi-line-summary-first-line)
]

[tool.ruff.lint.per-file-ignores]
# books.py: stricter — ANN (annotations) added; D/T201/PTH123 suppressed inline
# All other files: D (docstrings) and ANN (annotations) not required
"book_app.py"       = ["T201", "ANN", "D"]
"utils.py"          = ["T201", "ANN", "D"]
"logging_config.py" = ["ANN", "D"]
# tests: suppress categories that generate high noise in test files and are
#        intentional by design (documented in ai-track-docs/run-14-static-analysis.md)
# INP001: no __init__.py in tests/ — intentional simple pytest layout
# PLR2004: magic values in assertions — idiomatic and expected in tests
# SIM117: nested-with in resilience retry tests — required by test structure
# PT011: broad pytest.raises — acceptable when exception type is exact
"tests/*.py"        = ["ANN", "D", "S101", "INP001", "PLR2004", "SIM117", "PT011"]
